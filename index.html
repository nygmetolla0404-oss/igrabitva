<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Білім шайқасы — 1 VS 1</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react"
      }
    }
  </script>
</head>
<body class="bg-slate-950">
  <div id="root"></div>
  <script type="module">
    // No build step: the game source is compiled in the browser, so editing 1_vs_1.tsx is enough
    import React from 'react';
    import { createRoot } from 'react-dom/client';

    const source = await fetch('./1_vs_1.tsx', { cache: 'no-cache' }).then((res) => res.text());
    const { code } = Babel.transform(source, {
      filename: '1_vs_1.tsx',
      presets: ['react', ['typescript', { isTSX: true, allExtensions: true }]],
    });
    const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    const { default: App } = await import(url);

    createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
